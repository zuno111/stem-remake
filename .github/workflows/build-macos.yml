name: build-macos

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio
          pip install -r requirements-lite.txt
          pip install demucs
          # 다성 전사(basic-pitch): tensorflow/numpy<2 핀 회피 위해 --no-deps + onnx 백엔드
          pip install --no-deps basic-pitch
          pip install onnxruntime mir_eval resampy
          pip install pyinstaller==6.11.1

      - name: Pre-download Demucs models (htdemucs + htdemucs_6s)
        run: |
          pip install --upgrade certifi
          python build/download_models.py "${{ github.workspace }}/models"
          echo "models dir size:"; du -sh "${{ github.workspace }}/models" || true

      - name: Build (PyInstaller)
        working-directory: build
        env:
          STEMREMAKE_REQUIRE_MODELS: '1'
        run: pyinstaller stem_remake.spec --noconfirm --clean

      - name: Smoke test
        working-directory: build/dist/StemRemake
        run: |
          test -f ./StemRemake || { echo "StemRemake 실행파일 없음"; exit 1; }
          echo "size:"; ls -la ./StemRemake

      - name: Zip
        run: |
          cd build/dist
          zip -r -q ../../StemRemake-macos.zip StemRemake
      - uses: actions/upload-artifact@v4
        with:
          name: StemRemake-macos
          path: StemRemake-macos.zip
          retention-days: 14
