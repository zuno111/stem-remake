name: build-macos

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio
          pip install -r requirements-lite.txt
          pip install demucs
          pip install pyinstaller==6.11.1

      - name: Pre-download Demucs model (htdemucs)
        env:
          TORCH_HOME: ${{ github.workspace }}/models
        run: |
          pip install --upgrade certifi
          export SSL_CERT_FILE="$(python -c 'import certifi; print(certifi.where())')"
          export REQUESTS_CA_BUNDLE="$SSL_CERT_FILE"
          echo "SSL_CERT_FILE=$SSL_CERT_FILE"
          python -c "from demucs.pretrained import get_model; m=get_model('htdemucs'); print('model sources:', m.sources)"
          ls -R "${{ github.workspace }}/models" || true

      - name: Build (PyInstaller)
        working-directory: build
        run: pyinstaller stem_remake.spec --noconfirm --clean

      - name: Smoke test
        working-directory: build/dist/StemRemake
        run: |
          test -f ./StemRemake || { echo "StemRemake 실행파일 없음"; exit 1; }
          echo "size:"; ls -la ./StemRemake

      - name: Zip
        run: |
          cd build/dist
          zip -r -q ../../StemRemake-macos.zip StemRemake
      - uses: actions/upload-artifact@v4
        with:
          name: StemRemake-macos
          path: StemRemake-macos.zip
          retention-days: 14
