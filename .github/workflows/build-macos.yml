name: build-macos

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio
          pip install -r requirements-lite.txt
          pip install demucs
          # 다성 전사(basic-pitch): tensorflow/numpy<2 핀 회피 위해 --no-deps + onnx 백엔드
          pip install --no-deps basic-pitch
          pip install onnxruntime mir_eval resampy
          pip install pyinstaller==6.11.1

      - name: Pre-download Demucs models (htdemucs + htdemucs_6s)
        continue-on-error: true
        run: |
          pip install --upgrade certifi
          set +e
          python build/download_models.py "${{ github.workspace }}/models" | tee /tmp/dl.log
          code=${PIPESTATUS[0]}
          set -e
          res=$(grep '^RESULT ' /tmp/dl.log | head -1)
          echo "::warning title=models::$res"
          sz=$(du -sh "${{ github.workspace }}/models" 2>/dev/null | cut -f1)
          echo "::warning title=models_dir_size::$sz"
          if [ "$code" -ne 0 ]; then echo "::warning::모델 번들 실패(앱은 첫 실행 시 자동 다운로드). 빌드는 계속."; fi

      - name: Build (PyInstaller)
        working-directory: build
        run: pyinstaller stem_remake.spec --noconfirm --clean

      - name: Smoke launch test (실제 실행 + 헬스체크)
        working-directory: build/dist/StemRemake
        run: |
          test -f ./StemRemake || { echo "StemRemake 실행파일 없음"; exit 1; }
          echo "size:"; ls -la ./StemRemake
          rm -f stemremake_error.log stemremake_url.txt out.log err.log
          export STEMREMAKE_PORT=8777
          ./StemRemake >out.log 2>err.log &
          PID=$!
          ok=0
          for i in $(seq 1 40); do
            sleep 2
            if curl -fsS -m 3 "http://127.0.0.1:8777/" >/dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null && [ ! -f stemremake_error.log ]; then break; fi
          done
          echo "=== STDOUT ==="; cat out.log 2>/dev/null || true
          echo "=== STDERR ==="; cat err.log 2>/dev/null || true
          if [ -f stemremake_error.log ]; then
            echo "=== ERROR LOG (시작 크래시 트레이스백) ==="; cat stemremake_error.log
          fi
          kill "$PID" 2>/dev/null || true
          pkill -f StemRemake 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "서버가 응답하지 않음 — 앱이 시작 중 종료됨(위 에러 로그 확인)"; exit 1; fi
          echo "헬스체크 통과: 서버가 http://127.0.0.1:8777/ 에서 정상 응답"

      - name: Zip
        run: |
          cd build/dist
          zip -r -q ../../StemRemake-macos.zip StemRemake
      # 아티팩트 업로드 경로가 막혀서, 고정 태그 Release로 발행(고정 다운로드 링크 제공)
      - name: Publish to Release (latest-macos)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=latest-macos
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" StemRemake-macos.zip --title "StemRemake (macOS) latest" --notes "commit ${{ github.sha }}"
          echo "다운로드: https://github.com/${{ github.repository }}/releases/download/latest-macos/StemRemake-macos.zip"
