name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      STEMREMAKE_ONEFILE: "1"   # 단일 실행파일(.exe 하나)로 빌드 — 압축 풀기 불필요
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # audio-separator 0.28.5가 torch<2.5 요구 → 2.4.1로 고정(demucs와도 호환)
          pip install torch==2.4.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-lite.txt
          pip install demucs
          # 다성 전사(basic-pitch): tensorflow/numpy<2 핀 회피 위해 --no-deps + onnx 백엔드
          pip install --no-deps basic-pitch
          pip install onnxruntime mir_eval resampy
          # 드럼 조각 실제 모델 분리(MDX23C DrumSep). numpy<2 호환 버전.
          pip install "audio-separator==0.28.5"
          pip install pyinstaller==6.11.1
          # PyInstaller 6.11.1의 pkg_resources 런타임 훅이 setuptools>=81에서
          # NullProvider 제거로 깨짐 → 호환 버전으로 고정(맨 마지막에 설치)
          pip install "setuptools==70.3.0"

      - name: Pre-download Demucs models (htdemucs + htdemucs_6s)
        continue-on-error: true
        shell: pwsh
        run: |
          pip install --upgrade certifi
          $out = python build/download_models.py "${{ github.workspace }}\models" 2>&1
          $out | ForEach-Object { Write-Host $_ }
          $res = ($out | Select-String '^RESULT ').ToString()
          Write-Host "::warning title=models::$res"
          $sz = "{0:N1} MB" -f ((Get-ChildItem -Recurse "${{ github.workspace }}\models" -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum/1MB)
          Write-Host "::warning title=models_dir_size::$sz"
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::모델 번들 실패(앱은 첫 실행 시 자동 다운로드). 빌드는 계속." }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Download ffmpeg (audio-separator 필수)
        shell: pwsh
        run: |
          $dst = "${{ github.workspace }}\build\ffmpeg"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffx" -Force
          $exe = Get-ChildItem -Recurse "$env:RUNNER_TEMP\ffx" -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName (Join-Path $dst "ffmpeg.exe") -Force
          & (Join-Path $dst "ffmpeg.exe") -version | Select-Object -First 1

      - name: Pre-download DrumSep model (MDX23C)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\ffmpeg;$env:PATH"
          $mdir = "${{ github.workspace }}\models\audio_separator"
          New-Item -ItemType Directory -Force -Path $mdir | Out-Null
          python - <<'PY'
          import os
          from audio_separator.separator import Separator
          mdir = os.path.join(os.environ["GITHUB_WORKSPACE"], "models", "audio_separator")
          sep = Separator(output_dir=mdir, model_file_dir=mdir, log_level=40)
          sep.load_model(model_filename="MDX23C-DrumSep-aufr33-jarredou.ckpt")
          print("DrumSep model files:", sorted(os.listdir(mdir)))
          PY
          $sz = "{0:N1} MB" -f ((Get-ChildItem -Recurse $mdir -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum/1MB)
          Write-Host "::warning title=drumsep_model_size::$sz"
          $global:LASTEXITCODE = 0
          exit 0

      - name: Build (PyInstaller)
        shell: pwsh
        working-directory: build
        run: pyinstaller stem_remake.spec --noconfirm --clean

      - name: Smoke launch test (실제 실행 + 헬스체크)
        shell: pwsh
        working-directory: build/dist
        run: |
          if (!(Test-Path ".\StemRemake.exe")) { throw "StemRemake.exe 없음" }
          Write-Host "exe size (MB):" ([math]::Round((Get-Item ".\StemRemake.exe").Length/1MB,1))
          # 포트 고정 후 실제로 실행해서 서버가 응답하는지 확인(창 사라짐/시작 크래시 탐지)
          # 단일 파일은 첫 실행 시 임시폴더로 추출하느라 시작이 느려 대기 시간을 넉넉히.
          $env:STEMREMAKE_PORT = "8777"
          $env:STEMREMAKE_NO_BROWSER = "1"
          Remove-Item stemremake_error.log,stemremake_url.txt,out.log,err.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath ".\StemRemake.exe" -PassThru -NoNewWindow `
               -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8777/" -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ($p.HasExited -and -not (Test-Path stemremake_error.log)) { break }
          }
          Write-Host "=== STDOUT ==="; Get-Content out.log -ErrorAction SilentlyContinue
          Write-Host "=== STDERR ==="; Get-Content err.log -ErrorAction SilentlyContinue
          if (Test-Path stemremake_error.log) {
            Write-Host "=== ERROR LOG (시작 크래시 트레이스백) ==="
            Get-Content stemremake_error.log
          }
          # 서버 프로세스 정리
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch { }
          Get-Process StemRemake -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "서버가 응답하지 않음 — 앱이 시작 중 종료됨(위 에러 로그 확인)" }
          Write-Host "헬스체크 통과: 서버가 http://127.0.0.1:8777/ 에서 정상 응답"

      - name: 진단 로그 수집(실패 시)
        if: failure()
        shell: pwsh
        working-directory: build/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msg = ""
          if (Test-Path stemremake_error.log) { $msg = Get-Content stemremake_error.log -Raw }
          if (-not $msg -and (Test-Path err.log)) { $msg = Get-Content err.log -Raw }
          if (-not $msg) { $msg = "(에러 로그 없음 — out/err 확인)" }
          $esc = $msg -replace '%','%25' -replace "`r","%0D" -replace "`n","%0A"
          Write-Host "::error title=startup-crash-windows::$esc"
          $z = Join-Path $env:RUNNER_TEMP "diag-windows.zip"
          Compress-Archive -Path stemremake_error.log,err.log,out.log -DestinationPath $z -Force -ErrorAction SilentlyContinue
          gh release delete diag-windows --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create diag-windows $z --title "diag windows" --notes "sha ${{ github.sha }}" 2>$null
          $global:LASTEXITCODE = 0

      # 단일 실행파일(.exe)을 그대로 Release로 발행 — 압축 풀기 불필요, 더블클릭 실행
      - name: Publish to Release (latest-windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item build/dist/StemRemake.exe StemRemake.exe -Force
          $tag = "latest-windows"
          gh release delete $tag --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create $tag StemRemake.exe --title "StemRemake (Windows) latest" --notes "commit ${{ github.sha }} · 단일 실행파일(압축 풀기 불필요)"
          Write-Host "다운로드: https://github.com/${{ github.repository }}/releases/download/latest-windows/StemRemake.exe"
