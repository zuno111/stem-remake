name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-lite.txt
          pip install demucs
          # 다성 전사(basic-pitch): tensorflow/numpy<2 핀 회피 위해 --no-deps + onnx 백엔드
          pip install --no-deps basic-pitch
          pip install onnxruntime mir_eval resampy
          pip install pyinstaller==6.11.1

      - name: Pre-download Demucs models (htdemucs + htdemucs_6s)
        shell: pwsh
        run: |
          pip install --upgrade certifi
          $out = python build/download_models.py "${{ github.workspace }}\models" 2>&1
          $out | ForEach-Object { Write-Host $_ }
          $res = ($out | Select-String '^RESULT ').ToString()
          Write-Host "::warning title=models::$res"
          $sz = "{0:N1} MB" -f ((Get-ChildItem -Recurse "${{ github.workspace }}\models" -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum/1MB)
          Write-Host "::warning title=models_dir_size::$sz"
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::모델 번들 실패(앱은 첫 실행 시 자동 다운로드). 빌드는 계속." }

      - name: Build (PyInstaller)
        shell: pwsh
        working-directory: build
        run: pyinstaller stem_remake.spec --noconfirm --clean

      - name: Smoke import test
        shell: pwsh
        working-directory: build/dist/StemRemake
        run: |
          # exe가 정상 생성됐는지 확인
          if (!(Test-Path ".\StemRemake.exe")) { throw "StemRemake.exe 없음" }
          Write-Host "exe size:" (Get-Item ".\StemRemake.exe").Length

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/dist/StemRemake/* -DestinationPath StemRemake-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: StemRemake-windows
          path: StemRemake-windows.zip
          retention-days: 14
